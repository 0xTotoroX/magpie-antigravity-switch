<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity Switch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="client.js"></script>
  </head>
  <body>
    <main class="shell hide-cli-actions" id="switchPage">
      <header class="topbar">
        <div class="title-block">
          <div class="title-row">
            <h1>Antigravity Switch</h1>
            <button
              type="button"
              class="btn toolbar-action support-link"
              id="btnGitHubStar"
              title="打开 GitHub 仓库并点亮 Star 支持项目" data-i18n-title="supportTitle"
              aria-label="前往 GitHub 仓库点亮 Star 支持项目" data-i18n-label="supportTitle"
            >
              <svg class="toolbar-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2.2 9.8 5.9l4.1.6-2.95 2.9.7 4.1L8 11.55 4.35 13.5l.7-4.1L2.1 6.5l4.1-.6Z" />
              </svg>
              <span data-i18n="support">支持</span>
            </button>
          </div>
        </div>
        <button type="button" id="quotaStatus" class="quota-status" aria-haspopup="dialog" hidden></button>
        <div class="toolbar">
          <button type="button" class="btn toolbar-action" id="btnToggleCli" aria-controls="accountList"
            aria-label="显示 CLI 标签和操作" aria-pressed="false" title="显示 CLI 标签和操作">
            <svg class="toolbar-icon" viewBox="0 0 16 16" aria-hidden="true">
              <g class="cli-toggle-eye">
                <path d="M2 8s2.1-4.1 6-4.1S14 8 14 8s-2.1 4.1-6 4.1S2 8 2 8Z" />
                <circle cx="8" cy="8" r="1.7" />
              </g>
              <path class="cli-toggle-eye-off" d="m2.3 2.3 11.4 11.4M6.4 4.1A6.3 6.3 0 0 1 8 3.9C11.9 3.9 14 8 14 8s-.6 1.15-1.7 2.2M9.6 11.9a6.3 6.3 0 0 1-1.6.2C4.1 12.1 2 8 2 8s.6-1.15 1.7-2.2" />
            </svg>
            <span>CLI</span>
          </button>
          <button type="button" class="btn toolbar-action" id="btnRefresh">
            <svg class="toolbar-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13.45 6.2A5.75 5.75 0 1 0 13.4 9.9m.05-7.15V6.2H10" />
            </svg>
            <span id="refreshLabel" data-i18n="refresh">刷新</span>
          </button>
        </div>
      </header>

      <div class="toast hidden" id="toastBanner" role="status"></div>

      <section class="list-section">
        <div class="account-list" id="accountList">
          <div class="account-empty-state" data-i18n="loading">正在读取账号…</div>
        </div>
        <details class="unavailable-accounts" id="unavailableAccounts" hidden>
          <summary id="unavailableSummary" data-i18n="unavailableAccounts">不可用账号</summary>
          <div class="account-list" id="unavailableList"></div>
        </details>
      </section>
      <span id="operationStatus" class="sr-only" role="status" aria-atomic="true"></span>
      <dialog id="feedbackDialog" aria-labelledby="feedbackTitle">
        <h2 id="feedbackTitle"></h2>
        <p id="feedbackBody"></p>
        <button type="button" id="closeFeedback" class="btn" autofocus data-i18n="close">关闭</button>
      </dialog>
    </main>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
