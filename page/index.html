<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity Switch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="_magpie/bridge.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title-block">
          <h1>Antigravity Switch</h1>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-filter" id="btnTogglePro">
            隐藏非会员
          </button>
          <button type="button" class="btn" id="btnOrganize" title="自动纳管已识别会员账号、停用异常账号并置顶会员">
            整理账号
          </button>
          <button type="button" class="btn btn-ghost" id="btnRefresh">
            刷新
          </button>
        </div>
      </header>

      <div class="toast hidden" id="toastBanner"></div>

      <p class="account-notice hidden" id="desktopNotice" role="status">桌面端账号待确认</p>

      <section class="list-section">
        <div class="account-list" id="accountList">
          <div class="account-empty-state">正在读取账号…</div>
        </div>
        <details class="unavailable-accounts" id="unavailableAccounts" hidden>
          <summary id="unavailableSummary">不可用账号</summary>
          <div class="account-list" id="unavailableList"></div>
        </details>
      </section>
    </main>

    <script src="state.js"></script>
    <script src="app.js"></script>
  </body>
</html>
