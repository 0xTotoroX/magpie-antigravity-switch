<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity Switch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="_magpie/bridge.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title-block">
          <div class="title-row">
            <h1>Antigravity Switch</h1>
            <button
              type="button"
              class="github-star-badge"
              id="btnGitHubStar"
              title="打开 GitHub 仓库并点亮 Star 支持项目" data-i18n-title="supportTitle"
              aria-label="前往 GitHub 仓库点亮 Star 支持项目" data-i18n-label="supportTitle"
            >
              <span data-i18n="support">支持</span>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.45"
                  stroke-linejoin="round"
                  d="M8 1.5l2.03 4.11 4.54.66-3.28 3.2.77 4.52L8 11.86 3.94 13.99l.77-4.52-3.28-3.2 4.54-.66L8 1.5z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-ghost" id="btnRefresh">
            <svg class="refresh-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.4 6A5.75 5.75 0 1 0 13.5 9.6M13.5 2.5V6h-3.5" />
            </svg>
            <span id="refreshLabel" data-i18n="refresh">刷新</span>
          </button>
        </div>
      </header>

      <div class="toast hidden" id="toastBanner" role="status"></div>

      <p class="account-notice hidden" id="desktopNotice" data-i18n="desktopUnknown" role="status">桌面端账号待确认</p>

      <section class="list-section">
        <div class="account-list" id="accountList">
          <div class="account-empty-state" data-i18n="loading">正在读取账号…</div>
        </div>
        <details class="unavailable-accounts" id="unavailableAccounts" hidden>
          <summary id="unavailableSummary" data-i18n="unavailableAccounts">不可用账号</summary>
          <div class="account-list" id="unavailableList"></div>
        </details>
      </section>
    </main>

    <script src=".runtime/state.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
