<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity Switch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="_magpie/bridge.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title-block">
          <h1>Antigravity Switch</h1>
          <p class="subtitle" id="subtitleText">正在读取账号状态…</p>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-filter" id="btnTogglePro" title="仅显示已识别的会员账号">
            隐藏非会员
          </button>
          <button type="button" class="btn" id="btnOrganize" title="自动纳管已识别会员账号、停用异常账号并置顶会员">
            整理账号
          </button>
          <button type="button" class="btn btn-ghost" id="btnRefresh" title="重新读取 Magpie 配额缓存与本地登录状态">
            刷新
          </button>
        </div>
      </header>

      <div class="toast hidden" id="toastBanner"></div>

      <section class="status-strip" id="statusStrip">
        <div class="status-cell">
          <span class="status-label">桌面端</span>
          <span class="status-email" id="curDesktopEmail">-</span>
          <span class="status-dot" id="curDesktopDot"></span>
        </div>
        <div class="status-divider"></div>
        <div class="status-cell">
          <span class="status-label">CLI (agy)</span>
          <span class="status-email" id="curCliEmail">-</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-cell">
          <span class="status-label">Magpie 首选</span>
          <span class="status-email" id="curMagpieEmail">-</span>
        </div>
      </section>

      <section class="list-section">
        <p class="quota-source">额度来自 Magpie</p>
        <div class="account-list" id="accountList">
          <div class="account-empty-state">正在读取 Magpie 配额与本地登录状态…</div>
        </div>
        <div class="hidden-footer hidden" id="hiddenFooter"></div>
        <details class="unavailable-accounts" id="unavailableAccounts" hidden>
          <summary id="unavailableSummary">不可用账号</summary>
          <div class="account-list" id="unavailableList"></div>
        </details>
      </section>
    </main>

    <script src="state.js"></script>
    <script src="app.js"></script>
  </body>
</html>
